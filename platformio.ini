; PlatformIO 工程配置
;
; 关键点说明：
;   - build_flags 里用 -D USER_SETUP_LOADED=1 配合 -include，
;     把仓库内的 include/User_Setup.h 强制传给 TFT_eSPI。
;     这样引脚配置跟着仓库走，别人 clone 下来不用去改第三方库的私有文件。
;   - 所有第三方库都由 lib_deps 声明，不再往仓库里 vendor 源码。

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; 3.5 寸 ILI9488 触摸彩屏 + DHT11 需要较大 Flash，huge_app 分区给 3MB 应用空间
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.1.0
    adafruit/DHT sensor library@^1.4.6
    arduino-libraries/NTPClient@^3.2.1

build_flags =
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h
    -I include
    -Wall
